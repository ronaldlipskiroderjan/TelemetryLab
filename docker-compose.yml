name: telemetrylab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetrylab
      POSTGRES_PASSWORD: telemetrylab
      POSTGRES_USER: telemetrylab
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telemetrylab -d telemetrylab']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - telemetrylab-postgres-data:/var/lib/postgresql/data

volumes:
  telemetrylab-postgres-data:
